[project]
name = "stock-research-agent"
version = "0.1.0"
description = "AI agent with Gradio UI for stock market research using Ollama and SerpAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
